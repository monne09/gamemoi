<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Ngăn trình duyệt điện thoại tự động zoom khi chạm liên tục -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bài tập 23 - Game kiểm tra tốc độ phản xạ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent; /* Tắt khung xanh khi chạm trên đt */
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh; /* Tối ưu chiều cao cho trình duyệt mobile */
            padding: 12px;
            overflow-x: hidden;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 12px;
            font-size: clamp(18px, 5vw, 24px);
            text-align: center;
        }

        .dashboard {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
        }

        .stat-box {
            font-size: clamp(15px, 4vw, 18px);
            font-weight: 600;
            color: #334155;
        }

        .stat-box span {
            color: #2563eb;
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: bold;
        }

        #time-display {
            color: #dc2626;
        }

        #start-btn {
            padding: 10px 18px;
            font-size: clamp(14px, 3.8vw, 16px);
            font-weight: bold;
            color: #ffffff;
            background-color: #16a34a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        #start-btn:hover:not(:disabled) {
            background-color: #15803d;
        }

        #start-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        #start-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Khu vực chơi: Chuẩn 600x400 trên PC, tự co giãn 100% chiều ngang trên đt */
        #arena {
            width: 100%;
            max-width: 600px;
            height: 400px;
            position: relative;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 4px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            user-select: none;
            touch-action: manipulation; /* Chống độ trễ 300ms và chống cuộn trang khi chạm */
        }

        /* Mục tiêu hình tròn nhỏ định vị tuyệt đối */
        .target {
            width: 44px; /* Tăng nhẹ lên 44px để dễ chạm bằng ngón tay trên đt */
            height: 44px;
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #dc2626);
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: crosshair;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            transition: transform 0.05s ease;
        }

        .target:active {
            transform: scale(0.85);
        }

        /* Màn hình thông báo kết quả khi hết giờ */
        #result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        #result-overlay h2 {
            font-size: clamp(26px, 7vw, 32px);
            color: #facc15;
            margin-bottom: 10px;
        }

        #result-overlay p {
            font-size: clamp(16px, 4.5vw, 20px);
            margin-bottom: 20px;
        }

        #result-overlay span {
            font-size: clamp(24px, 6vw, 28px);
            font-weight: bold;
            color: #4ade80;
        }

        /* Điều chỉnh riêng cho màn hình điện thoại nhỏ (< 620px) */
        @media (max-width: 620px) {
            #arena {
                height: 62vh; /* Chiếm 62% chiều cao màn hình điện thoại để chơi thoải mái */
                min-height: 320px;
            }
            .dashboard {
                justify-content: space-around;
            }
            #start-btn {
                width: 100%; /* Nút bấm trải rộng toàn hàng trên đt cho dễ bấm */
            }
        }
    </style>
</head>
<body>

    <h1>🎯 Game Kiểm Tra Tốc Độ Phản Xạ</h1>

    <!-- Thanh hiển thị thông tin & nút điều khiển -->
    <div class="dashboard">
        <div class="stat-box">Điểm số: <span id="score-display">0</span></div>
        <div class="stat-box">Thời gian: <span id="time-display">30</span>s</div>
        <button id="start-btn">Bắt đầu trò chơi</button>
    </div>

    <!-- Khu vực chơi -->
    <div id="arena">
        <div id="result-overlay">
            <h2>HẾT GIỜ!</h2>
            <p>Tổng số điểm đạt được: <span id="final-score">0</span></p>
        </div>
    </div>

    <script>
        const arena = document.getElementById('arena');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');
        const resultOverlay = document.getElementById('result-overlay');
        const finalScore = document.getElementById('final-score');

        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let countdownTimer = null;
        let moveTimer = null;
        let currentTarget = null;

        const TARGET_SIZE = 44; // Kích thước đường kính mục tiêu (44px)
        const SPAWN_SPEED = 400; // Tốc độ nhảy mục tiêu: 400ms (0.4 giây)

        // Hàm tạo tọa độ ngẫu nhiên và hiển thị mục tiêu
        function spawnTarget() {
            if (!isPlaying) return;

            if (currentTarget) {
                currentTarget.remove();
            }

            const target = document.createElement('div');
            target.classList.add('target');

            // Tự động lấy kích thước thực tế của #arena (dù trên PC hay điện thoại)
            const maxLeft = Math.max(0, arena.clientWidth - TARGET_SIZE);
            const maxTop = Math.max(0, arena.clientHeight - TARGET_SIZE);

            const randomLeft = Math.floor(Math.random() * maxLeft);
            const randomTop = Math.floor(Math.random() * maxTop);

            target.style.left = randomLeft + 'px';
            target.style.top = randomTop + 'px';

            // Dùng pointerdown để bắt sự kiện tức thì cho cả chuột (PC) và cảm ứng (điện thoại)
            target.addEventListener('pointerdown', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (!isPlaying) return;

                score++;
                scoreDisplay.textContent = score;

                // Đặt lại bộ đếm 0.4 giây và đổi vị trí mục tiêu ngay lập tức
                resetMoveInterval();
                spawnTarget();
            });

            arena.appendChild(target);
            currentTarget = target;
        }

        // Đặt lại chu kỳ tự động đổi vị trí mỗi 0.4 giây (400ms)
        function resetMoveInterval() {
            clearInterval(moveTimer);
            moveTimer = setInterval(() => {
                spawnTarget();
            }, SPAWN_SPEED);
        }

        // Hàm bắt đầu trò chơi
        function startGame() {
            score = 0;
            timeLeft = 30;
            isPlaying = true;

            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            resultOverlay.style.display = 'none';
            startBtn.disabled = true;
            startBtn.textContent = 'Đang chơi...';

            spawnTarget();
            resetMoveInterval();

            // Bộ đếm ngược thời gian 30 giây
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // Hàm kết thúc trò chơi và khóa toàn bộ thao tác
        function endGame() {
            isPlaying = false;
            clearInterval(countdownTimer);
            clearInterval(moveTimer);

            if (currentTarget) {
                currentTarget.remove();
                currentTarget = null;
            }

            finalScore.textContent = score;
            resultOverlay.style.display = 'flex';

            startBtn.disabled = false;
            startBtn.textContent = 'Chơi lại';
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
